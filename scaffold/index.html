<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<title>Web Terminal</title>
<!-- App icons and web-app manifest are deployment-specific; add your own. -->
<!-- /style.css = the package's css/MANIFEST concatenated: the reference
     FULL-PAGE bundle (css/page.css — html/body reset + @font-face expecting
     the font files at /vendor/fonts/ — plus the complete tabbed component
     set). An embedder serves a per-preset manifest (css/MANIFEST.single/
     .touch/.tabbed) instead and passes layout: "container". -->
<link rel="stylesheet" href="/style.css">
<!-- No critical CSS for the loading overlay: css/page.css owns .wt-loading and
     arrives with /style.css above, which is render-blocking, so nothing paints
     before it either way. A consumer that also wants a failure surface for the
     case where /style.css itself fails to load adds its own minimal inline block
     for that (web-terminal-kiro does); a bare host does not need one. -->
</head>
<body>
<!-- createTerminal() builds the entire terminal UI inside this single root
     element. The loading overlay is a sibling (not a child of the root) so it is
     never cleared; it is faded out once the first frame renders.
     The overlay is styled by css/page.css through the wt-loading* CLASSES, not
     by its id — recolor it by setting the tokens (--wt-loading-accent,
     --wt-loading-bg, ...) on this element in your own CSS. role="status" is
     load-bearing: the kernel writes a progressive status line into it if startup
     drags on, and that is the channel a screen reader reads. -->
<div id="terminal"></div>
<div id="loading" class="wt-loading" role="status" aria-label="Loading">
  <div class="wt-loading-bar" aria-hidden="true"></div>
</div>
<!-- Deployment-specific: the importmap resolves the bare package specifiers to
     the compiled JS your build emits. Adjust the paths to your build layout. -->
<script type="importmap">
{
  "imports": {
    "@cplieger/web-terminal-engine": "/vendor/cplieger-web-terminal-engine/index.js",
    "@cplieger/web-terminal-ui": "/vendor/cplieger-web-terminal-ui/index.js",
    "@cplieger/web-terminal-ui/presets": "/vendor/cplieger-web-terminal-ui/presets.js"
  }
}
</script>
<script type="module">
  import { createTerminal } from "@cplieger/web-terminal-ui";
  import { presetTabbed } from "@cplieger/web-terminal-ui/presets";
  // The root is passed as a SELECTOR and the preset as a FUNCTION, and both
  // matter: createTerminal resolves the selector and calls the preset inside its
  // own failure boundary, so a missing root element or a preset that throws
  // renders the library's "Terminal failed to start" surface and lowers the
  // overlay. Resolving the element here instead (and calling presetTabbed() as
  // an argument) moves both failures OUTSIDE that boundary, where the only
  // outcome is a page stuck on the spinner and an error in the console.
  createTerminal("#terminal", { features: presetTabbed, loading: document.getElementById("loading") });
</script>
</body>
</html>
